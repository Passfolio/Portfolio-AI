name: Auto Create PR

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR already exists
        id: check-pr
        run: |
          PR_NUM=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number // empty')
          echo "exists=${PR_NUM:+true}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract issue number and build PR body
        if: steps.check-pr.outputs.exists != 'true'
        id: build
        run: |
          BRANCH="${{ github.ref_name }}"
          ISSUE_NUM=$(echo "$BRANCH" | sed -E 's/feature\/([0-9]+)-.*/\1/')
          SUMMARY=$(git log origin/main..HEAD --oneline | tail -1 | sed 's/^[a-f0-9]* //')
          COMMITS=$(git log origin/main..HEAD --oneline | sed 's/^[a-f0-9]* /- /')

          echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT
          echo "title=$SUMMARY" >> $GITHUB_OUTPUT

          cat > /tmp/pr-body.md << 'PREOF'
          ## 변경 요약

          SUMMARY_PLACEHOLDER

          ## 변경 유형

          - [ ] 새 기능 (feature)
          - [ ] 버그 수정 (fix)
          - [ ] 리팩토링 (refactor)
          - [ ] 인프라 / 환경 설정 (infra)
          - [ ] 문서 (docs)

          ## 주요 변경 내용

          COMMITS_PLACEHOLDER

          ## 관련 이슈

          Closes #ISSUE_NUM_PLACEHOLDER

          ## AI 스택 영향 여부

          - [ ] 임베딩 모델 / 차원 변경 없음 (`gemini-embedding-2-preview`, 3072d 유지)
          - [ ] pgvector 스키마 변경 없음
          - [ ] Spring Boot 인터페이스 스펙 변경 없음

          > 위 항목 중 하나라도 변경된 경우, 변경 사유와 영향 범위를 아래에 명시하세요.

          ## 테스트

          - [ ] 단위 테스트 추가 / 수정
          - [ ] 로컬 실행 확인
          - [ ] 관련 서비스(Spring Boot) 연동 확인
          PREOF

          sed -i "s|SUMMARY_PLACEHOLDER|$SUMMARY|" /tmp/pr-body.md
          sed -i "s|COMMITS_PLACEHOLDER|$COMMITS|" /tmp/pr-body.md
          sed -i "s|ISSUE_NUM_PLACEHOLDER|$ISSUE_NUM|" /tmp/pr-body.md

      - name: Create PR
        if: steps.check-pr.outputs.exists != 'true'
        run: |
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "${{ steps.build.outputs.title }}" \
            --body-file /tmp/pr-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
